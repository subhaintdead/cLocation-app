<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>cLocation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0b1220;--card:#131c2e;--text:#f1f5f9;--dim:#94a3b8;--blue:#2563eb;--green:#16a34a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100%;padding:12px;gap:8px;max-width:900px;margin:0 auto}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .dim{color:var(--dim);font-size:14px}
  #name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #status{font-weight:700;text-align:right}
  #mapwrap{position:relative;flex:1;min-height:220px;border-radius:14px;overflow:hidden;background:var(--card)}
  #map{position:absolute;inset:0}
  #cover{position:absolute;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:1000;flex-direction:column;gap:6px}
  .card{background:var(--card);border-radius:14px;padding:12px 14px}
  button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  button.alt,.btn.alt{background:#1e293b;color:var(--dim)}
  input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid #1e293b;border-radius:12px;padding:14px;margin:6px 0}
  #code{text-align:center;letter-spacing:4px;font-size:24px;text-transform:uppercase}
  .switch{display:flex;justify-content:space-between;align-items:center}
  .switch input{width:44px;height:24px}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  #form{display:none;margin:auto 0;width:100%}
  h1{margin:0 0 12px;text-align:center}
  .err{color:#f87171;min-height:1.4em}
  .pill{padding:6px 12px;font-size:14px;border-radius:20px;background:#1e293b;color:var(--dim);border:0}
</style>
</head>
<body>
<div id="app">
  <div id="form">
    <h1>cLocation</h1>
    <input id="code" type="text" placeholder="CODE" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <input id="viewer" type="text" placeholder="Your name (optional)" maxlength="30">
    <button id="go" style="width:100%">Watch</button>
    <p class="err" id="formerr"></p>
    <p class="dim" style="text-align:center"><a id="get1" style="color:var(--dim)">Get the app</a></p>
  </div>

  <div id="live" style="display:none;flex:1;flex-direction:column;gap:8px;min-height:0">
    <div class="row"><div id="name">…</div><div id="status">…</div></div>
    <div class="dim" id="detail"></div>
    <div id="mapwrap"><div id="map"></div>
      <div id="cover"><div style="font-weight:700" id="cover1"></div><div class="dim" id="cover2"></div></div>
    </div>
    <div class="dim" id="hint"></div>
    <div class="card">
      <div class="switch"><label for="me">Show my location</label><input id="me" type="checkbox"></div>
      <div class="links" id="melinks" style="display:none">
        <button class="pill" id="fit">Fit both</button><button class="pill" id="ctr">Center on vehicle</button>
      </div>
      <div class="err" id="meerr"></div>
      <div class="links">
        <a class="btn alt" id="openapp" style="display:none">Open in app</a>
        <a class="btn alt" id="get2">Get the app</a>
        <button class="alt" id="back">Another code</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---- config (public by design, same values as src/config.ts) ---- */
var SUPABASE_URL='https://nqvokmrnuxdvmpjxumuf.supabase.co';
var SUPABASE_KEY='sb_publishable_dwrViXdHZDK03j_H86q5gw_afQgUgpD';
var DOWNLOAD_URL='https://subhaintdead.github.io/cLocation-download';
var APP_PACKAGE='com.sealfish.clocation';

/* ---- statuses: keep in sync with src/status.ts ---- */
var LIVE_MS=120000;
var META={
  live:{label:'Live',color:'#16a34a',hint:''},
  lost:{label:'Signal lost',color:'#d97706',hint:'Still sharing, but no update lately. Showing the last known place.'},
  stopped:{label:'Stopped sharing',color:'#94a3b8',hint:'The sender pressed Stop. Showing the last known place.'},
  waiting:{label:'Waiting for sender',color:'#94a3b8',hint:'The sender has not started sharing yet.'},
  expired:{label:'Code expired',color:'#dc2626',hint:'This code no longer works. Ask the sender for a new one.'},
  not_found:{label:'Code not found',color:'#dc2626',hint:'Check the code, or ask the sender for the current one.'}
};
function statusOf(d,age){
  if(!d)return 'not_found';
  if(d.expired)return 'expired';
  if(d.at==null||age==null)return 'waiting';
  if(!d.sharing)return 'stopped';
  return age<=LIVE_MS?'live':'lost';
}
function agoShort(ms){
  var s=Math.max(0,Math.round(ms/1000));
  if(s<10)return 'just now'; if(s<60)return s+' s ago';
  var m=Math.floor(s/60); if(m<60)return m+' min ago';
  var h=Math.floor(m/60); if(h<24)return h+' h '+(m%60)+' min ago';
  return Math.floor(h/24)+' d ago';
}
function inText(ms){
  var m=Math.max(0,Math.floor(ms/60000));
  if(m<1)return 'less than a minute'; if(m<60)return m+' min';
  var h=Math.floor(m/60); if(h<48)return h+' h '+(m%60)+' min';
  return Math.floor(h/24)+' d '+(h%24)+' h';
}
function statusLine(st,age){
  if(st==='live')return age!=null&&age>=10000?'Live \u00b7 '+agoShort(age):'Live';
  if((st==='lost'||st==='stopped')&&age!=null)return META[st].label+' \u00b7 last seen '+agoShort(age);
  return META[st].label;
}
function fmtDist(m){
  if(m<100)return Math.round(m/5)*5+' m';
  if(m<1000)return Math.round(m/10)*10+' m';
  var k=m/1000; return k<10?k.toFixed(1)+' km':Math.round(k)+' km';
}
function distanceM(a,b){
  var R=6371008.8,r=function(x){return x*Math.PI/180};
  var dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  var h=Math.pow(Math.sin(dLat/2),2)+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.pow(Math.sin(dLng/2),2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}

/* ---- helpers ---- */
var $=function(id){return document.getElementById(id)};
var CODE_RE=/^[A-Z0-9_-]{3,16}$/;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
function viewerId(){var v=store('vid');if(!v||v.length<8){v=Math.random().toString(36).slice(2)+Date.now().toString(36);store('vid',v);}return v;}
function rpc(fn,args){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},10000);
  return fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify(args),signal:ctl.signal})
    .then(function(r){return r.text().then(function(x){clearTimeout(t);if(!r.ok)throw new Error(x);return x?JSON.parse(x):null;});});
}
function codeFromUrl(){
  var c=new URLSearchParams(location.search).get('code');
  if(!c)return null; c=c.trim().toUpperCase(); return CODE_RE.test(c)?c:null;
}
$('get1').href=$('get2').href=DOWNLOAD_URL;

/* ---- map ---- */
var map=null,mk=null,line=null,fitted=false,meMk=null,meAcc=null,link=null,meFitted=false;
function ensureMap(){
  if(map)return;
  map=L.map('map').setView([26.4,88.8],6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
}
function drawLink(){
  if(link){map.removeLayer(link);link=null;}
  if(mk&&meMk)link=L.polyline([mk.getLatLng(),meMk.getLatLng()],{color:'#f1f5f9',weight:2,dashArray:'6 8',opacity:.85}).addTo(map);
}
function fitBoth(){if(mk&&meMk)map.fitBounds(L.latLngBounds([mk.getLatLng(),meMk.getLatLng()]),{padding:[60,60],maxZoom:17});}
function centerVehicle(){if(mk)map.setView(mk.getLatLng(),Math.max(map.getZoom(),16));}
function drawVehicle(d){
  if(d.lat==null)return; ensureMap();
  var p=[d.lat,d.lng];
  if(!mk)mk=L.circleMarker(p,{radius:10,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(map); else mk.setLatLng(p);
  if(line){map.removeLayer(line);line=null;}
  if(d.trail&&d.trail.length>1)line=L.polyline(d.trail,{color:'#2563eb',weight:4,opacity:.5}).addTo(map);
  drawLink();
  if(meMk){if(!meFitted){fitBoth();meFitted=true;}}
  else if(!fitted){map.setView(p,16);fitted=true;}
  else if(!map.getBounds().contains(p))map.panTo(p);
}
function setMe(m){
  ensureMap(); var p=[m.lat,m.lng];
  if(!meMk){
    meAcc=L.circle(p,{radius:m.acc||0,color:'#16a34a',weight:1,fillColor:'#16a34a',fillOpacity:.1}).addTo(map);
    meMk=L.circleMarker(p,{radius:8,color:'#fff',weight:3,fillColor:'#16a34a',fillOpacity:1}).addTo(map);
  }else{meMk.setLatLng(p);meAcc.setLatLng(p);meAcc.setRadius(m.acc||0);}
  drawLink();
  if(!meFitted&&mk){fitBoth();meFitted=true;} else if(!mk&&!meFitted)map.setView(p,16);
}
function clearMe(){[meMk,meAcc,link].forEach(function(x){if(x)map.removeLayer(x);});meMk=meAcc=link=null;meFitted=false;}

/* ---- live view ---- */
var code=null,d=null,net=true,rtOk=false,me=null,watchId=null,sb=null,ch=null,chan=null,timer=null,busy=false,again=false,gone=false;

function fromRaw(r,recv){
  return {name:r.name||'',sharing:!!r.sharing,expired:!!r.expired,lat:r.lat==null?null:r.lat,lng:r.lng==null?null:r.lng,at:r.at==null?null:r.at,
    trail:r.trail||[],chan:r.chan||null,expiresAt:r.expires_at==null?null:r.expires_at,skew:r.now-recv};
}
function applyUpdate(s,u){
  if(u.sharing!==undefined)s.sharing=u.sharing;
  if(u.lat!=null&&u.lng!=null&&u.at!=null&&(s.at==null||u.at>=s.at)){
    s.lat=u.lat;s.lng=u.lng;s.at=u.at;
    var add=u.trail||[],last=s.trail[s.trail.length-1],al=add[add.length-1];
    if(add.length&&!(last&&al&&last[0]===al[0]&&last[1]===al[1]))s.trail=s.trail.concat(add).slice(-60);
  }
  return s;
}

function poll(){
  if(busy){again=true;return;}
  busy=true; clearTimeout(timer);
  rpc('get_latest',{p_code:code,p_viewer:viewerId(),p_name:($('viewer').value||'').trim()}).then(function(r){
    if(gone)return;
    if(!r){showForm('Code not found. The sender may have changed it.');return false;}
    net=true; d=fromRaw(r,Date.now()); useChannel(d.chan); render(); return true;
  }).catch(function(){net=false;render();}).then(function(ok){
    busy=false; if(ok===false||gone)return;
    var wait=again?0:(d&&d.expired)?15000:rtOk?30000:5000; again=false;
    timer=setTimeout(poll,wait);
  });
}
function useChannel(c){
  if(c===chan)return; chan=c;
  if(ch){try{sb.removeChannel(ch)}catch(e){} ch=null; rtOk=false;}
  if(!c||!window.supabase)return;
  try{
    sb=sb||window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    ch=sb.channel('v:'+c,{config:{broadcast:{self:false},private:false}});
    ch.on('broadcast',{event:'u'},function(m){
      var u=m&&m.payload; if(!u)return;
      if(u.refresh){poll();return;}
      if(d){applyUpdate(d,u);render();}
    }).subscribe(function(st){rtOk=(st==='SUBSCRIBED');render();poll();});
  }catch(e){rtOk=false;}
}

function render(){
  if(!d){$('status').textContent=net?'\u2026':'Offline';return;}
  var age=d.at!=null?Math.max(0,Date.now()+d.skew-d.at):null;
  var st=statusOf(d,age),m=META[st];
  $('name').textContent=d.name||code;
  $('status').textContent=statusLine(st,age); $('status').style.color=m.color;
  var det=[];
  if(me&&d.lat!=null&&$('me').checked)det.push(fmtDist(distanceM(me,{lat:d.lat,lng:d.lng}))+' from you');
  if(d.expiresAt&&!d.expired)det.push('code expires in '+inText(d.expiresAt-(Date.now()+d.skew)));
  det.push(rtOk?'realtime':net?'checking every 5 s':'offline, retrying');
  $('detail').textContent=det.join(' \u00b7 ');
  $('hint').textContent=(st==='lost'||st==='stopped'||st==='waiting')?m.hint:'';
  $('cover').style.display=st==='expired'?'flex':'none';
  $('cover1').textContent=m.label; $('cover2').textContent=m.hint;
  document.title=(d.name||code)+' \u00b7 cLocation';
  drawVehicle(d);
}

function startLive(c){
  code=c; gone=false; d=null; chan=null; again=false; busy=false;
  $('form').style.display='none'; $('live').style.display='flex';
  ensureMap(); setTimeout(function(){map.invalidateSize()},50);
  // "Open in app": Android intent, falls back to the download page if the app is not installed
  var ua=navigator.userAgent||'';
  if(/Android/i.test(ua)){
    var fb=encodeURIComponent(DOWNLOAD_URL);
    $('openapp').href='intent://watch?code='+encodeURIComponent(c)+'#Intent;scheme=clocation;package='+APP_PACKAGE+';S.browser_fallback_url='+fb+';end';
    $('openapp').style.display='inline-block';
  }
  poll();
}
function stopLive(){
  gone=true; clearTimeout(timer);
  if(ch&&sb){try{sb.removeChannel(ch)}catch(e){}} ch=null;chan=null;rtOk=false;
  if(mk&&map){map.removeLayer(mk);mk=null;} if(line&&map){map.removeLayer(line);line=null;} clearMe(); fitted=false;
  $('me').checked=false; toggleMe();
}
function showForm(msg){
  stopLive(); $('live').style.display='none'; $('form').style.display='block';
  $('formerr').textContent=msg||''; $('code').value=code||'';
  history.replaceState(null,'',location.pathname);
}

/* ---- my location (stays in this browser, never sent anywhere) ---- */
function toggleMe(){
  var on=$('me').checked; $('melinks').style.display=on?'flex':'none'; $('meerr').textContent='';
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  if(!on){me=null;if(map)clearMe();render();return;}
  if(!navigator.geolocation){$('meerr').textContent='Location is not available in this browser.';$('me').checked=false;$('melinks').style.display='none';return;}
  watchId=navigator.geolocation.watchPosition(function(p){
    me={lat:p.coords.latitude,lng:p.coords.longitude}; setMe({lat:me.lat,lng:me.lng,acc:p.coords.accuracy||0}); render();
  },function(e){
    $('meerr').textContent=e.code===1?'Location permission was denied.':'Could not get your location.';
    $('me').checked=false;$('melinks').style.display='none';me=null;
  },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}

/* ---- wiring ---- */
$('me').addEventListener('change',toggleMe);
$('fit').addEventListener('click',fitBoth);
$('ctr').addEventListener('click',centerVehicle);
$('back').addEventListener('click',function(){code=null;showForm('');});
function go(){
  var c=($('code').value||'').trim().toUpperCase();
  if(!CODE_RE.test(c)){$('formerr').textContent='Enter a valid code (3-16 letters or digits).';return;}
  store('vname',($('viewer').value||'').trim());
  history.replaceState(null,'','?code='+encodeURIComponent(c));
  startLive(c);
}
$('go').addEventListener('click',go);
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
setInterval(function(){if(d)render();},1000); // keeps "x s ago" and live -> lost correct between updates

$('viewer').value=store('vname')||'';
var initial=codeFromUrl();
if(initial){$('code').value=initial;startLive(initial);}
else{$('form').style.display='block';}
</script>
</body>
</html>
